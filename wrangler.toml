name = "ashfall-brawl-workers"
compatibility_date = "2026-11-06"

main = "www/_worker.js"

[[durable_objects.bindings]]
name = "FIGHT_ROOM"
class_name = "FightRoom"

[exports.FightRoom]
type = "durable-object"
storage = "sqlite"

[env.production]
WORKER_URL = "https://ashfallbrawl.workers.dev"

[env.staging]
WORKER_URL = "https://ashfall-brawl-staging.workers.dev"