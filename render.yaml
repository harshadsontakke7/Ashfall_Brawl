services:
  - type: web
    name: ashfall-brawl-server
    runtime: node
    rootDir: server
    plan: free            # free tier sleeps after idle; starter keeps WebSockets always-on
    region: singapore          # pick the Render region closest to most players
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: https://ashfallbrawl.vercel.app
